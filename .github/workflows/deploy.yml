name: Deploy Safe Journey Club Website

on:
  push:
    branches:
      - main # Скрипт спрацьовуватиме при пуші в гілку main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript Project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Папка, куди Vite збирає готовий сайт
          branch: gh-pages # Гілка, з якої GitHub запускатиме сайт
